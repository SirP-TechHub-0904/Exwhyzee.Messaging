name: Deploy API (api.xyzsms.com)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Exwhyzee.Messaging.Api/**'
      - 'Exwhyzee.Messaging.Core/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  REMOTE_APP_DIR: '/var/www/xyzsms-api'
  SERVICE_NAME: 'xyzsms-api'

jobs:
  build-and-deploy-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore Exwhyzee.Messaging.Api/Exwhyzee.Messaging.Api.csproj

      - name: Publish API Application
        run: dotnet publish Exwhyzee.Messaging.Api/Exwhyzee.Messaging.Api.csproj -c Release -o ./publish-api

      - name: Prepare Remote Folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}

      - name: Copy Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "./publish-api/*"
          target: "${{ env.REMOTE_APP_DIR }}/"
          strip_components: 1
          overwrite: true

      - name: Restart API Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script: |
            if systemctl is-active --quiet ${{ env.SERVICE_NAME }}; then
              systemctl restart ${{ env.SERVICE_NAME }}
              echo "API service (${{ env.SERVICE_NAME }}) restarted successfully."
            else
              echo "API service (${{ env.SERVICE_NAME }}) is not running or not yet configured."
            fi
