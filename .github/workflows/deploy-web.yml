name: Deploy Web (xyzsms.com)

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Exwhyzee.Messaging.Web/**'
      - 'Exwhyzee.Messaging.Core/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  REMOTE_APP_DIR: '/var/www/xyzsms-web'
  SERVICE_NAME: 'xyzsms-web'

jobs:
  build-and-deploy-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore Exwhyzee.Messaging.Web/Exwhyzee.Messaging.Web.csproj

      - name: Publish Web Application
        run: dotnet publish Exwhyzee.Messaging.Web/Exwhyzee.Messaging.Web.csproj -c Release -o ./publish-web

      - name: Prepare Remote Folder
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            mkdir -p ${{ env.REMOTE_APP_DIR }}
            mkdir -p ${{ env.REMOTE_APP_DIR }}/wwwroot/uploads/modals

      - name: Copy Files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          source: "./publish-web/*"
          target: "${{ env.REMOTE_APP_DIR }}/"
          strip_components: 1
          overwrite: true

      - name: Restart Web Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SERVER_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER || 'root' }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            if systemctl is-active --quiet ${{ env.SERVICE_NAME }}; then
              systemctl restart ${{ env.SERVICE_NAME }}
              echo "Web service (${{ env.SERVICE_NAME }}) restarted successfully."
            else
              echo "Web service (${{ env.SERVICE_NAME }}) is not running or not yet configured."
            fi
